<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adding Apricus to your server</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1;url=https://discord.com/api/oauth2/authorize?client_id=1565375148717121616&permissions=564496410471639&scope=bot%20applications.commands">
</head>
<body style="font-family:system-ui;background:#313338;color:#dbdee1;padding:3rem">
<h1>Taking you to Discord&hellip;</h1>
<p>If nothing happens, use this link:</p>
<p><a href="https://discord.com/api/oauth2/authorize?client_id=1565375148717121616&permissions=564496410471639&scope=bot%20applications.commands">Add Apricus to your server</a></p>
<img src="https://abacus.jasoncameron.dev/hit/apricus-bot/page-install" alt="" width="1" height="1" aria-hidden="true" style="position:absolute;left:-9999px">
<script src="/ref-attrib.js"></script>
<script>
/* Three independent ways to reach the SAME canonical URL: the meta refresh in the
   head, location.replace here, and the visible anchor above. The pixel fires BEFORE
   the redirect so its request is already in flight. Named page-install, not a new
   key family, because tools/site_counter_impl.py _totals() only understands page-*
   (visits) and ref-* (attribution) - a third family would be invisible to every
   delta instrument and read as absent forever. */
setTimeout(function () {
  location.replace("https://discord.com/api/oauth2/authorize?client_id=1565375148717121616&permissions=564496410471639&scope=bot%20applications.commands");
}, 400);  /* 0ms would cancel the in-flight pixel request; 400ms is imperceptible */
</script>
</body>
</html>
